name: Inspect Google Forms links (preview only)
on:
  push:
    branches:
      - preview/seletor-inteligente-rotas
    paths:
      - .github/workflows/inspect-google-form.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/seletor-inteligente-rotas
      - name: Resolve short link and inspect public field IDs without submitting
        shell: python
        run: |
          import urllib.request, re, json, urllib.error
          urls = [
            'https://forms.gle/m2Zs4nSjbHcDELX8A',
            'https://docs.google.com/forms/d/e/1FAIpQLSdgNe0ViWtpMASsPOIDwEE3yqnCuzoVEwQWUgI1-C3PCjM-nQ/viewform'
          ]
          results=[]
          for url in urls:
            r={'input_url':url,'fields':[],'status':'not_checked'}
            try:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                html=resp.read().decode('utf-8')
                r['resolved_url']=resp.geturl()
                r['http_status']=resp.status
              m=re.search(r'FB_PUBLIC_LOAD_DATA_\s*=\s*(\[.*?\]);',html,flags=re.S)
              if m:
                data=json.loads(m.group(1))
                for item in data[1][1]:
                  label=str(item[1])
                  for opt in item[4] or []:
                    if isinstance(opt,list) and isinstance(opt[0],int):
                      r['fields'].append({'label':label,'entry':f'entry.{opt[0]}'})
                r['status']='ok'
              else:
                r['status']='missing-public-load-data'
            except Exception as e:
              r['status']='error'
              r['error']=str(e)[:160]
            results.append(r)
          with open('form-entry-map.json','w') as f:
            json.dump({'checked_links':results},f,indent=2,ensure_ascii=False)
          print(json.dumps(results,indent=2,ensure_ascii=False))
      - name: Commit metadata to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add form-entry-map.json
          git commit -m 'chore: identify fields for requested short Google Forms link' || exit 0
          git push origin HEAD:preview/seletor-inteligente-rotas
