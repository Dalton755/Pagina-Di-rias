<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Resumo Funcionários</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#f5f5f5;
padding:30px;
padding-top:10px;

}

.topo{

position:sticky;
top:0;
z-index:1000;

display:flex;
gap:15px;
flex-wrap:wrap;

margin-bottom:30px;

padding:15px;

background:#f5f5f5;

backdrop-filter:blur(10px);

border-radius:15px;

box-shadow:
0 4px 10px rgba(0,0,0,.08);

}

input,select{

padding:12px 15px;
border:none;
border-radius:12px;
font-size:16px;
background:white;

box-shadow:
0 3px 8px rgba(0,0,0,.08);

min-width:250px;

}

.container{

display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(300px,1fr)
);

gap:20px;

}

.card{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);

}

.nome{

font-size:22px;
font-weight:bold;
margin-bottom:15px;

}

.info{

margin:10px 0;
font-size:18px;

}

.valor{

font-size:25px;
font-weight:bold;
color:green;

}

.mes{

color:#666;
margin-bottom:15px;

}

</style>

</head>

<body>

<h1>
Resumo de Pagamentos
</h1>

<br>

<div class="topo">

<input
id="pesquisa"
placeholder="Pesquisar funcionário..."
>

<select id="mesFiltro">

<option value="">
Todos os meses
</option>

</select>

</div>

<div
class="container"
id="cards"
></div>

<script>

const API="https://script.google.com/macros/library/d/1bqRU42vIbv69CaZMWYMUrY0lRfKyT693ZMiLNmpcdzTetRGZd6CcUiO2/5";

let dados=[];

async function carregar(){

const resposta=
await fetch(API);

dados=
await resposta.json();

popularMeses();

renderizar();

}

function popularMeses(){

const select =
document.getElementById(
"mesFiltro"
);

// limpa tudo e mantém apenas a opção padrão
select.innerHTML=
`
<option value="">
Todos os meses
</option>
`;

// remove vazios e #N/A
const meses = [
...new Set(
dados
.filter(
x =>
x.mes &&
x.mes != "#N/A"
)
.map(
x => x.mes
)
)
];

// ordenação correta
meses.sort((a,b)=>{

const n1=
parseInt(
a.match(/\d+/)?.[0] || 0
);

const n2=
parseInt(
b.match(/\d+/)?.[0] || 0
);

return n1-n2;

});

meses.forEach(m=>{

select.innerHTML +=
`
<option value="${m}">
${m}
</option>
`;

});

}

function renderizar(){

const pesquisa=
document
.getElementById(
"pesquisa"
)
.value
.toLowerCase();

const mes=
document
.getElementById(
"mesFiltro"
)
.value;

const cards=
document.getElementById(
"cards"
);

cards.innerHTML="";

const filtrado=
dados.filter(f=>{

const nomeOk=
f.nome
.toLowerCase()
.includes(
pesquisa
);

const mesOk=
!mes ||
f.mes==mes;

return nomeOk &&
mesOk;

});


const agrupado={};

filtrado.forEach(item=>{

if(
!agrupado[item.nome]
){

agrupado[item.nome]={

nome:item.nome,
horas:0,
total:0,
pago:0

};

}

agrupado[
item.nome
]
.horas+=
Number(
item.horas
);

agrupado[
item.nome
]
.total+=
Number(
item.total
);

agrupado[
item.nome
]
.pago+=
Number(
item.pago
);

});


Object.values(
agrupado
)
.forEach(func=>{

const saldo=
func.total-
func.pago;

cards.innerHTML+=`

<div class="card">

<div class="nome">

👤 ${func.nome}

</div>

<div class="info">

⏱ Horas:
${func.horas.toFixed(2)}

</div>

<div class="info">

💰 Valor Total:
R$ ${func.total.toFixed(2)}

</div>

<div class="info">

✅ Valor Pago:
R$ ${func.pago.toFixed(2)}

</div>

<div class="info valor">

📊 Saldo:
R$ ${saldo.toFixed(2)}

</div>

</div>

`;

});

}

document
.getElementById(
"pesquisa"
)
.addEventListener(
"input",
renderizar
);

document
.getElementById(
"mesFiltro"
)
.addEventListener(
"change",
renderizar
);

carregar();

setInterval(()=>{

const mesAtual =
document.getElementById(
"mesFiltro"
).value;

const pesquisaAtual =
document.getElementById(
"pesquisa"
).value;

carregar().then(()=>{

document.getElementById(
"mesFiltro"
).value=mesAtual;

document.getElementById(
"pesquisa"
).value=pesquisaAtual;

renderizar();

});

},30000);

</script>

</body>

</html>
